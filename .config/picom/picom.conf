# Picom compositor configuration

# Backend — xrender is required for xwinwrap compatibility on AMD/amdgpu
# GLX backend mishandles desktop-layer ARGB windows on this hardware
backend = "xrender";

# Shadows
shadow = true;
shadow-radius = 7;
shadow-opacity = 0.7;
shadow-offset-x = -7;
shadow-offset-y = -7;

# Exclude xwinwrap from shadows
shadow-exclude = [
  "name = 'xwinwrap'",
  "class_g = 'xwinwrap'",
  "_NET_WM_WINDOW_TYPE:a *= '_NET_WM_WINDOW_TYPE_DESKTOP'",
  "_NET_WM_WINDOW_TYPE:a *= '_NET_WM_WINDOW_TYPE_DOCK'"
];

# Fading
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;

# Exclude wallpaper from fading
fade-exclude = [
  "name = 'xwinwrap'",
  "class_g = 'xwinwrap'",
  "_NET_WM_WINDOW_TYPE:a *= '_NET_WM_WINDOW_TYPE_DESKTOP'"
];

# Opacity — handled by kitty's background_opacity
opacity-rule = [];

# Window type policy — critical for xwinwrap to render correctly
wintypes:
{
  desktop = {
    shadow = false;
    fade = false;
    opacity = 1.0;
    focus = false;
  };
  dock = {
    shadow = false;
    fade = false;
  };
  tooltip = {
    shadow = false;
    fade = false;
    opacity = 0.9;
    focus = false;
    full-shadow = false;
  };
  normal = {
    shadow = true;
    fade = true;
  };
};

# Do not focus/track the xwinwrap window
mark-wmwin-focused = false;
mark-ovredir-focused = false;

# Misc
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;
vsync = true;
use-damage = false;
refresh-rate = 60;
